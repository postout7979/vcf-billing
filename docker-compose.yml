# [v4.0] VCF Billing Portal - Docker Compose 구성.
#
# 4개 서비스로 분리되어 있어, 하나를 고쳐도 나머지는 그대로 둔 채 그 서비스만
# 재빌드/재시작할 수 있다:
#   - db        : PostgreSQL (데이터)
#   - migrate   : 스키마 생성 + 기본 admin 계정 보장 (1회 실행 후 종료)
#   - api       : FastAPI 백엔드 (docs/docker-deploy.md 기준 사용법 참고)
#   - collector : VM 인벤토리/전원상태 5분 주기 수집 백그라운드 프로세스
#   - frontend  : 정적 파일(Nginx) + /api/* 리버스 프록시, 127.0.0.1:8080에만 바인딩
#                 (외부 HTTPS 노출은 기존처럼 호스트 nginx+certbot이 담당 -
#                  docs/docker-deploy.md 참고)
#
# 사용법 (docs/docker-deploy.md에 전체 절차):
#   cp .env.example .env && nano .env   # SECRET_KEY, POSTGRES_PASSWORD 등 채우기
#   docker compose up -d --build
#   docker compose logs -f api collector
#
# 개별 서비스만 재배포하는 예:
#   docker compose up -d --build api          # API 코드만 바꿨을 때
#   docker compose up -d --build collector     # 수집 로직만 바꿨을 때
#   docker compose up -d --build frontend      # 화면(static/)만 바꿨을 때

services:
  db:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # 스키마 생성 + 기본 admin 계정 보장을 API/Collector보다 먼저, 딱 한 번만 실행한다.
  # api를 여러 워커로, collector까지 별도 프로세스로 띄우면서 여러 프로세스가 동시에
  # 테이블/기본 admin 계정을 만들려다 부딪히는 경쟁 상태를 막기 위함이다
  # (app/bootstrap_db.py 주석 참고). api/collector 이미지와 코드가 같으므로 api용
  # Dockerfile을 그대로 재사용한다.
  migrate:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    env_file: .env
    dns:
      # [v4.1] See DOCKER_DNS_1/DOCKER_DNS_2 in .env.example - without this,
      # containers inherit the host's /etc/resolv.conf, which on Ubuntu is
      # often just the systemd-resolved stub (127.0.0.53) and unreachable
      # from inside a container. migrate itself doesn't call out to VCF
      # Operations, but it shares the api image/config, so it gets the same
      # setting for consistency.
      - ${DOCKER_DNS_1:-1.1.1.1}
      - ${DOCKER_DNS_2:-8.8.8.8}
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "app.bootstrap_db"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    env_file: .env
    environment:
      # collector는 별도 컨테이너로 뜨므로 API 프로세스 안에서는 중복 실행하지 않는다.
      RUN_COLLECTOR_IN_PROCESS: "false"
    dns:
      # [v4.1] Needed to resolve the VCF Operations hostname
      # when an integration account is created/edited or "가져오기" (sync
      # now) is triggered from the admin UI - see DOCKER_DNS_1/DOCKER_DNS_2
      # in .env.example.
      - ${DOCKER_DNS_1:-1.1.1.1}
      - ${DOCKER_DNS_2:-8.8.8.8}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  collector:
    build:
      context: .
      dockerfile: docker/collector/Dockerfile
    env_file: .env
    dns:
      # [v4.1] Needed to resolve the VCF Operations hostname
      # on every collection cycle - see DOCKER_DNS_1/DOCKER_DNS_2 in
      # .env.example.
      - ${DOCKER_DNS_1:-1.1.1.1}
      - ${DOCKER_DNS_2:-8.8.8.8}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    ports:
      # 외부에는 이 포트를 직접 열지 않는다 - 127.0.0.1에만 바인딩하고, 호스트
      # nginx+certbot이 TLS를 붙여 이 포트로 리버스 프록시한다 (docs/docker-deploy.md).
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
