# [v4.0] frontend 컨테이너 내부 Nginx 설정.
#
# 정적 파일(static/)을 직접 서빙하고, /api/*는 api 컨테이너로 리버스 프록시한다.
# TLS는 여기서 처리하지 않는다 - 기존 방식대로 호스트(Ubuntu)의 nginx+certbot이
# 이 컨테이너의 노출 포트(기본 127.0.0.1:8080, docker-compose.yml 참고)로 다시
# 리버스 프록시하는 구조를 그대로 유지한다 (docs/docker-deploy.md 참고).
#
# resolver + 변수 조합으로 proxy_pass를 쓰는 이유: nginx는 기본적으로 시작 시점에
# upstream 호스트명(api)을 한 번만 DNS 조회해 IP를 캐싱한다. api 컨테이너만 따로
# 재시작/재배포하면 새 컨테이너는 다른 내부 IP를 받는데, 그러면 frontend가 캐싱해둔
# 옛 IP로 계속 연결을 시도하다 502를 내게 된다 - "컨테이너를 각자 독립적으로
# 재배포"하려는 이번 개편의 목적과 정면으로 어긋나는 흔한 함정이다. Docker 내장
# DNS(127.0.0.11)를 resolver로 지정하고 proxy_pass 대상을 변수로 주면, nginx가 매
# 요청마다(정확히는 valid=10s 캐시 TTL마다) 다시 조회하므로 api 컨테이너가 재시작돼
# IP가 바뀌어도 frontend를 재시작할 필요 없이 자동으로 새 IP를 따라간다.
resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    root /usr/share/nginx/html;
    index index.html;

    # 월별 결산서 PDF(reportlab) 생성은 VM이 많은 프로젝트일수록 시간이 걸릴 수 있어
    # 기본 프록시 타임아웃보다 넉넉하게 잡는다 (기존 nginx-vcf-billing.conf와 동일 기준).
    location ~ ^/api/(me|admin)/.*statement\.pdf$ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;
}
