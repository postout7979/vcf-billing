# Reverse proxy for VCF Billing Portal.
# Replace "billing.example.com" with your real hostname before use.
#
# Install path: /etc/nginx/sites-available/vcf-billing-portal
#   sudo ln -s /etc/nginx/sites-available/vcf-billing-portal /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# After this HTTP-only config is live, run:
#   sudo certbot --nginx -d billing.example.com
# certbot will automatically add the HTTPS server block and the
# HTTP -> HTTPS redirect on top of this file. Do not hand-write the
# SSL directives yourself -- let certbot manage the cert renewal hooks.

server {
    listen 80;
    listen [::]:80;
    server_name billing.example.com;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Monthly statement PDF generation (reportlab) can take a little
    # longer than a typical JSON response, especially for projects with
    # many VMs -- give these routes more headroom than the default.
    location ~ ^/api/(me|admin)/.*statement\.pdf$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    access_log /var/log/nginx/vcf-billing-portal.access.log;
    error_log  /var/log/nginx/vcf-billing-portal.error.log;
}
