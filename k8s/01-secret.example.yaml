# [v4.11] 민감한 값(암호/DB 접속 문자열)을 담는 Secret 템플릿.
#
# .env.example -> .env 와 정확히 같은 방식으로 쓴다:
#   cp k8s/01-secret.example.yaml k8s/01-secret.yaml
#   아래 "please-change-this" 값들을 실제 값으로 채운 뒤
#   kubectl apply -f k8s/01-secret.yaml
#
# k8s/01-secret.yaml은 .gitignore에 이미 등록되어 있어 실수로 커밋되지 않는다.
# 더 강한 보안이 필요하면(예: Git으로 관리하면서도 암호화하고 싶다면) 이 Secret
# 오브젝트 자체를 sealed-secrets/external-secrets 같은 도구로 대체할 수 있다 -
# 이 저장소는 별도 클러스터 애드온 설치를 전제하지 않는 가장 단순한 형태만 제공한다
# (docs/k8s-deploy.md "한계" 참고).
apiVersion: v1
kind: Secret
metadata:
  name: vcf-billing-secret
  namespace: vcf-billing
type: Opaque
stringData:
  # JWT 서명 + 연동 계정 비밀번호 암호화에 모두 쓰인다. openssl rand -hex 32로 생성.
  # 운영 중에는 절대 바꾸지 말 것 - 바꾸면 이미 저장된 연동 계정 비밀번호를 복호화할
  # 수 없다 (.env.example과 동일한 주의사항).
  SECRET_KEY: "please-change-this-to-a-random-secret"

  # 03-postgres.yaml의 StatefulSet이 최초 기동 시 이 값 그대로 계정/DB를 생성한다.
  # 아래 DATABASE_URL의 계정/비밀번호/DB명과 반드시 일치해야 한다.
  POSTGRES_USER: "vcfbilling"
  POSTGRES_PASSWORD: "please-change-this-too"
  POSTGRES_DB: "vcfbilling"

  # vcf-billing-postgres = 03-postgres.yaml의 Service 이름(같은 네임스페이스 안에서는
  # 짧은 이름으로 바로 해석됨 - Kubernetes Service DNS).
  DATABASE_URL: "postgresql+psycopg://vcfbilling:please-change-this-too@vcf-billing-postgres:5432/vcfbilling"

  # [v4.9] Operations DB(VM 인벤토리/전원상태)를 Billing DB와 별도 물리 DB로 분리하고
  # 싶을 때만 채운다. 비워두면(기본값) Billing DB와 같은 물리 DB를 그대로 쓴다 -
  # 대부분의 배포는 이 기본값 그대로 두면 된다. 자세한 내용은 docs/k8s-deploy.md
  # "Operations DB 분리" 참고.
  OPERATIONS_DATABASE_URL: ""
